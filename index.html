<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logos Seeker — Recovery Version Bible Search</title>
    <meta
      name="description"
      content="Search the Recovery Version Bible (English & Chinese) by reference or word. Static, serverless, works offline."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- iOS home-screen app: run without browser chrome. The meta tag is the
         legacy form still honoured by older iOS alongside the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Logos Seeker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Kept in step with the chosen colour scheme by AppProvider. -->
    <meta name="theme-color" content="#0f1115" />
    <!-- Apply the saved reading style before first paint, so there is no flash
         of the wrong colours, typeface or text size. The palettes and font
         stacks live in styles.css, keyed by these two attributes. -->
    <script>
      (function () {
        var root = document.documentElement;
        var get = function (k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var schemes = ["light", "sepia", "gray", "dark", "black"];
        var t = get("ls-theme");
        if (schemes.indexOf(t) < 0) {
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "sepia"
            : "dark";
        }
        root.setAttribute("data-theme", t);

        var fonts = ["system", "serif", "sans", "book", "kai"];
        var f = get("ls-font");
        root.setAttribute("data-font", fonts.indexOf(f) < 0 ? "system" : f);

        var s = parseInt(get("ls-font-size"), 10);
        if (s >= 14 && s <= 28) root.style.setProperty("--reading-size", s + "px");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
